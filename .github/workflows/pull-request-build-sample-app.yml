name: Preview PR changes

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-sample-app.yml

  upload_test_environment:
    name: Test
    needs:
      - build
    if: contains(github.event.pull_request.labels.*.name, 'preview:test')
    uses: ./.github/workflows/upload-sample-app.yml
    secrets:
      actito_services: ${{ secrets.SAMPLE_APP_TEST_ACTITO_SERVICES }}
      aws_iam_role: ${{ secrets.AWS_IAM_ROLE }}
      aws_region: ${{ secrets.AWS_REGION }}
      bucket_name: ${{ secrets.SAMPLE_APP_TEST_BUCKET_NAME }}
      distribution_id: ${{ secrets.SAMPLE_APP_TEST_DISTRIBUTION_ID }}

  upload_production_environment:
    if: contains(github.event.pull_request.labels.*.name, 'preview:production')
    name: Production
    needs:
      - build
    uses: ./.github/workflows/upload-sample-app.yml
    secrets:
      actito_services: ${{ secrets.SAMPLE_APP_ACTITO_SERVICES }}
      aws_iam_role: ${{ secrets.AWS_IAM_ROLE }}
      aws_region: ${{ secrets.AWS_REGION }}
      bucket_name: ${{ secrets.SAMPLE_APP_BUCKET_NAME }}
      distribution_id: ${{ secrets.SAMPLE_APP_DISTRIBUTION_ID }}


  comment_on_pr:
    name: Comment PR with live URLs
    permissions:
      pull-requests: write
    needs:
      - upload_test_environment
      - upload_production_environment
    if: always() && (needs.upload_test_environment.result == 'success' || needs.upload_production_environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Drop or update PR comment
        uses: actions/github-script@v9
        env:
          UPLOAD_TEST_RESULT: ${{ needs.upload_test_environment.result }}
          UPLOAD_PRODUCTION_RESULT: ${{ needs.upload_production_environment.result }}
          TEST_URL: ${{ vars.SAMPLE_APP_TEST_URL }}
          PRODUCTION_URL: ${{ vars.SAMPLE_APP_URL }}
        with:
          script: |
            const marker = '<!-- sample-app-deploy-comment -->';
            let message = `${marker}\nThe deployment pipeline finished successfully. Check the live updates here: \n\n`;
            
            if (process.env.UPLOAD_TEST_RESULT === 'success') {
              const testUrl = process.env.TEST_URL;
              message += `**Test Environment:** [${testUrl}](${testUrl})\n`;
            }
            
            if (process.env.UPLOAD_PRODUCTION_RESULT === 'success') {
              const productionUrl = process.env.PRODUCTION_URL;
              message += `**Production Environment:** [${productionUrl}](${productionUrl})\n`;
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const existentComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            
            if (existentComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existentComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
